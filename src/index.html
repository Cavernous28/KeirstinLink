<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeirstinLink</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <img src="assets/tauri.svg" alt="KeirstinLink" />
          <h1>KeirstinLink</h1>
        </div>
        <div class="header-actions">
          <button id="btn-refresh" class="btn">Refresh</button>
          <button id="btn-add-device" class="btn">+ Add Device</button>
          <button id="btn-settings" class="btn primary">Settings</button>
        </div>
      </header>

      <main class="content">
        <section id="sync" class="tab-panel active">
          <div class="panel-header">
            <h2>Devices</h2>
            <span id="device-count" class="badge">0</span>
          </div>
          <div id="device-list" class="card-list">
            <p class="empty">No devices yet. Click + Add Device to pair one.</p>
          </div>

          <div class="panel-header">
            <h2>Pending Approvals</h2>
            <span id="approval-count" class="badge">0</span>
          </div>
          <div id="approval-list" class="card-list">
            <p class="empty">No pending approvals.</p>
          </div>

          <div class="panel-header">
            <h2>Synced Files</h2>
            <span id="file-count" class="badge">0</span>
          </div>
          <div id="file-list" class="card-list">
            <p class="empty">No synced files yet.</p>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span id="status">Ready</span>
      </footer>

      <!-- Settings modal -->
      <div id="settings-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Settings</h2>
            <button id="btn-close-settings" class="btn icon">&times;</button>
          </div>
          <form id="settings-form">
            <label>
              <span>Device name</span>
              <input type="text" id="setting-device-name" placeholder="My PC" />
            </label>

            <label>
              <span>Mode</span>
              <select id="setting-mode">
                <option value="master">Master (source of truth)</option>
                <option value="client">Client (pull from master)</option>
              </select>
            </label>

            <label>
              <span>Sync folder</span>
              <input type="text" id="setting-folder" placeholder="C:\\Users\\cbaxt\\KeirstinLinkSync" />
              <button type="button" id="btn-browse-folder" class="btn">Browse...</button>
            </label>

            <label>
              <span>Master sync folder</span>
              <input type="text" id="setting-master-folder" placeholder="C:\\Users\\cbaxt\\KeirstinLinkMaster" />
              <button type="button" id="btn-browse-master-folder" class="btn">Browse...</button>
            </label>

            <div class="modal-actions">
              <button type="submit" class="btn primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
