[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keirstinlink"
version = "0.1.0"
description = "Bridge and launcher for coordinated Hermes Agent master/slave sessions."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Keirstin & Chris"}
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
keirstinlink = "src.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
